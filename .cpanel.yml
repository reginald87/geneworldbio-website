# cPanel Git Version Control / Node.js app deploy hook.
# Adjust DEPLOYPATH to match your cPanel application root.
---
deployment:
  tasks:
    - export DEPLOYPATH=/home/$USER/geneworldbio
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/rsync -a --delete --exclude '.git' --exclude 'node_modules' --exclude 'data' --exclude '.env' ./ "$DEPLOYPATH/"
    - cd "$DEPLOYPATH" && (/opt/cpanel/ea-nodejs22/bin/npm ci || npm ci)
    - cd "$DEPLOYPATH" && (/opt/cpanel/ea-nodejs22/bin/npm run build || npm run build)
    - cd "$DEPLOYPATH" && (/opt/cpanel/ea-nodejs22/bin/npm prune --omit=dev || npm prune --omit=dev)
