# cPanel Git Version Control / Node.js app deploy hook.
# Adjust DEPLOYPATH to match your cPanel application root.
---
deployment:
  tasks:
    - export DEPLOYPATH=/home/$USER/geneworldbio
    - mkdir -p "$DEPLOYPATH"
    - rsync -a --delete --exclude '.git' --exclude 'node_modules' --exclude 'data' --exclude '.env' ./ "$DEPLOYPATH/" || tar --exclude='.git' --exclude='node_modules' --exclude='data' --exclude='.env' -cf - . | tar -xf - -C "$DEPLOYPATH"
    - cd "$DEPLOYPATH" && npm ci --include=dev
    - cd "$DEPLOYPATH" && npm run build
    - cd "$DEPLOYPATH" && npm prune --omit=dev
